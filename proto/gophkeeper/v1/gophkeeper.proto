syntax = "proto3";

package gophkeeper.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kmorozov/gophkeeper/proto/gophkeeper/v1;gophkeeperv1";

// ItemType describes the kind of secret stored in an Item.
enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  LOGIN = 1;
  TEXT = 2;
  BINARY = 3;
  CARD = 4;
}

// RegisterRequest carries credentials for a new user.
message RegisterRequest {
  string login = 1;
  string password = 2;
}

// RegisterResponse is returned on successful registration.
message RegisterResponse {
  string token = 1;
  string user_id = 2;
}

// LoginRequest carries credentials of an existing user.
message LoginRequest {
  string login = 1;
  string password = 2;
}

// LoginResponse is returned on successful login.
message LoginResponse {
  string token = 1;
  string user_id = 2;
}

// PingResponse confirms that the server is reachable and the token is valid.
message PingResponse {
  bool ok = 1;
}

// Item is a single secret owned by a user.
message Item {
  string id = 1;
  ItemType type = 2;
  string name = 3;
  string login = 4;
  string password = 5;
  bytes data = 6;
  string card_number = 7;
  string card_exp = 8;
  string card_cvv = 9;
  string meta = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// CreateItemRequest asks the server to store a new Item.
message CreateItemRequest {
  Item item = 1;
}

// CreateItemResponse returns the id of the created Item.
message CreateItemResponse {
  string id = 1;
}

// GetItemRequest identifies the Item to fetch.
message GetItemRequest {
  string id = 1;
}

// GetItemResponse contains the requested Item.
message GetItemResponse {
  Item item = 1;
}

// ListItemsRequest asks for all items of the current user.
message ListItemsRequest {}

// ListItemsResponse contains all items of the current user.
message ListItemsResponse {
  repeated Item items = 1;
}

// DeleteItemRequest identifies the Item to delete.
message DeleteItemRequest {
  string id = 1;
}

// DeleteItemResponse reports the result of deletion.
message DeleteItemResponse {
  bool ok = 1;
}

// GophKeeper is the main service of the application.
service GophKeeper {
  // Register creates a new user and returns a JWT token.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Login authenticates an existing user and returns a JWT token.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Ping checks connectivity and token validity.
  rpc Ping(google.protobuf.Empty) returns (PingResponse);
  // CreateItem stores a new secret.
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  // GetItem returns a single secret by id.
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  // ListItems returns all secrets of the current user.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  // DeleteItem removes a secret by id.
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
}
