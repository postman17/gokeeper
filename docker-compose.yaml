services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gophkeeper
      POSTGRES_USER: gophkeeper
      POSTGRES_PASSWORD: gophkeeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophkeeper -d gophkeeper"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5437:5432"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gophkeeper
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gophkeeper}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"

  server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gophkeeper:gophkeeper@postgres:5432/gophkeeper?sslmode=disable
      JWT_SECRET: change-me-in-production
      GOPHKEEPER_MASTER_PASSWORD: dev-master-password
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: gophkeeper
      S3_ACCESS_KEY: gophkeeper
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gophkeeper}
    ports:
      - "3200:3200"

volumes:
  pgdata:
  miniodata:
